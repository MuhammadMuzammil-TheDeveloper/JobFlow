<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication · CareerFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-fade">
  <main class="auth-container">
    <div class="card">
      <h1 class="brand-title">CareerFlow</h1>
      <p class="brand-tagline">Your career. Your applications. One flow.</p>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button id="login-tab" class="tab-btn active">Login</button>
        <button id="signup-tab" class="tab-btn">Sign Up</button>
      </div>

      <div id="demo-banner" class="demo-banner"></div>

      <!-- Login View -->
      <div id="login-form-view">
        <div style="margin-bottom: 20px;">
          <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 4px;">Welcome back 👋</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted);">Sign in to continue to CareerFlow.</p>
        </div>
        <form>
          <div class="form-group">
            <label class="form-label" for="login-email">Email</label>
            <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
          </div>
          <button type="submit" id="signin-btn" class="btn btn-primary" style="margin-top: 8px;">Sign In</button>
        </form>
        <p class="auth-footer-text">
          Don't have an account? <a href="#" id="switch-to-signup">Sign Up</a>
        </p>
      </div>

      <!-- Sign Up View -->
      <div id="signup-form-view" style="display: none;">
        <div style="margin-bottom: 20px;">
          <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 4px;">Create your account</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted);">Start managing your career journey.</p>
        </div>
        <form>
          <div class="form-group">
            <label class="form-label" for="signup-name">Full Name</label>
            <input type="text" id="signup-name" class="form-input" placeholder="Muhammad Muzammil" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-email">Email</label>
            <input type="email" id="signup-email" class="form-input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <input type="password" id="signup-password" class="form-input" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-confirm">Confirm Password</label>
            <input type="password" id="signup-confirm" class="form-input" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <input type="hidden" id="selected-role" value="candidate">
            <div class="role-grid">
              <div class="role-option selected" data-role="candidate">Candidate</div>
              <div class="role-option" data-role="recruiter">Recruiter</div>
            </div>
          </div>
          <button type="submit" id="signup-btn" class="btn btn-primary">Create Account</button>
        </form>
        <p class="auth-footer-text">
          Already have an account? <a href="#" id="switch-to-login">Login</a>
        </p>
      </div>

    </div>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
