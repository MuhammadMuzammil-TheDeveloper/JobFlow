<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — CareerFlow</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<div class="auth-shell">

  <!-- Form panel -->
  <div class="auth-panel">
    <a href="index.html" class="brand">
      <span class="brand-mark"></span>
      CareerFlow
    </a>

    <div class="auth-panel-body">
      <div class="auth-card">
        <div class="auth-card-head">
          <h1>Welcome back</h1>
          <p>Log in to pick up where you left off.</p>
        </div>

        <div id="formAlert" class="alert alert-error" role="alert">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 5.5v3.25M8 11.25h.008M14.5 8A6.5 6.5 0 1 1 1.5 8a6.5 6.5 0 0 1 13 0Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="formAlertText"></span>
        </div>

        <div id="formSuccess" class="alert alert-success" role="status">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 4.5 6.4 11.6 3 8.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="formSuccessText"></span>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" />
            <p class="error-text" id="emailError"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" />
              <button type="button" class="password-toggle" data-toggle-for="password" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M1.5 9S4 3.75 9 3.75 16.5 9 16.5 9 14 14.25 9 14.25 1.5 9 1.5 9Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="9" r="2.25" stroke="currentColor" stroke-width="1.3"/></svg>
              </button>
            </div>
            <p class="error-text" id="passwordError"></p>
          </div>

          <button type="submit" class="btn btn-primary" id="loginBtn">
            <span class="spinner"></span>
            <span class="btn-label">Log in</span>
          </button>
        </form>

        <p class="auth-foot">
          Don't have an account? <a href="signup.html">Sign up</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Signature showcase panel -->
  <div class="auth-showcase">
    <div class="showcase-brand">
      <span class="brand">
        <span class="brand-mark"></span>
        CareerFlow
      </span>
    </div>

    <div class="flow-rail">
      <div class="flow-rail-track">
        <div class="flow-station is-complete">
          <span class="flow-station-line"></span>
          <span class="flow-station-dot">
            <svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="flow-station-text">
            <span class="label">Step 1</span>
            <span class="title">Create your account</span>
          </span>
        </div>
        <div class="flow-station is-complete">
          <span class="flow-station-line"></span>
          <span class="flow-station-dot">
            <svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="flow-station-text">
            <span class="label">Step 2</span>
            <span class="title">Verify your email</span>
          </span>
        </div>
        <div class="flow-station is-active">
          <span class="flow-station-dot"></span>
          <span class="flow-station-text">
            <span class="label">Step 3</span>
            <span class="title">Log in &amp; get to work</span>
          </span>
        </div>
      </div>
    </div>

    <p class="showcase-quote">
      "One flow, from application to offer."
      <span>Your pipeline is exactly where you left it.</span>
    </p>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
